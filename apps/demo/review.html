<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video review</title>
  <link rel="stylesheet" href="/annotator.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #101318; color: #f1f4f8; font: 14px system-ui, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid #353d49; }
    h1 { margin: 0; font-size: 17px; }
    #status { color: #aeb8c5; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; height: calc(100vh - 55px); }
    #stage { min-width: 0; overflow: hidden; background: #050608; }
    web-media-annotator { display: block; height: 100%; width: 100%; }
    aside { padding: 18px; border-left: 1px solid #353d49; overflow: auto; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    p { color: #aeb8c5; line-height: 1.5; }
    textarea { width: 100%; min-height: 100px; resize: vertical; background: #1b222c; border: 1px solid #485362; border-radius: 7px; color: white; padding: 10px; font: inherit; }
    button { background: #375fe9; color: white; border: 0; border-radius: 7px; padding: 9px 12px; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 10px 0; }
    #notes { list-style: none; padding: 0; display: grid; gap: 8px; }
    #notes button { width: 100%; text-align: left; background: #1b222c; border: 1px solid #394657; }
    .time { color: #8eafff; font-variant-numeric: tabular-nums; display: block; margin-bottom: 4px; }
    .note { white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 850px) { main { display: block; height: auto; } #stage { height: 65vh; } aside { border-left: 0; border-top: 1px solid #353d49; } }
  </style>
</head>
<body>
  <header><h1>Video review · <span id="filename"></span></h1><span id="status">Loading…</span></header>
  <main>
    <section id="stage"><web-media-annotator id="annotator" src="/video" fps="__FPS__"></web-media-annotator></section>
    <aside>
      <h2>Frame feedback</h2>
      <p>Pause on a frame, draw arrows or shapes on the video, then write a note. Feedback saves beside the video for Codex to read.</p>
      <div class="row"><strong id="position">Frame 0</strong><button id="save" type="button">Save now</button></div>
      <label for="note">Note at this frame</label>
      <textarea id="note" placeholder="What should change here?"></textarea>
      <div class="row"><button id="add" type="button">Add note</button><span id="count">0 notes</span></div>
      <ol id="notes"></ol>
    </aside>
  </main>
  <script src="/annotator.js"></script>
  <script type="module" src="/review.js"></script>
</body>
</html>
